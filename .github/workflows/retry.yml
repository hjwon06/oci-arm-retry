name: OCI ARM Retry

# Public repo = unlimited free Actions minutes.
# 4 runs/day x 350 min = ~23.3h of coverage. Job hard limit is 6h.
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Minutes to keep retrying'
        required: false
        default: '350'

# Never run two loops at once (they would race and burn OCI rate limit).
concurrency:
  group: oci-arm-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci

      - name: Retry loop
        id: create
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '350' }}
          INTERVAL_SEC: '60'
        run: python retry.py

      - name: Notify on success
        if: steps.create.outputs.instance_created == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ip = '${{ steps.create.outputs.public_ip }}';
            const id = '${{ steps.create.outputs.instance_id }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ARM instance created — crawl-server is up',
              body: [
                `Created at ${new Date().toISOString()}`,
                '',
                `Instance: \`${id}\``,
                `Public IP: \`${ip || '(pending — check console)'}\``,
                '',
                '```',
                `ssh ubuntu@${ip || '<PUBLIC_IP>'} -i ~/.oci/crawl_server_key`,
                '```'
              ].join('\n')
            });
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'retry.yml'
            });
